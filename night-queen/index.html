const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)],money=n=>'¥'+Math.round(n).toLocaleString('ja-JP');

const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let s;
const RECOVERY_MS=60000, RECOVERY_POINTS=5;
const STAMINA_KEY='night-queen-stamina-v2';
const japanDay=()=>new Date(Date.now()+9*60*60*1000).toISOString().slice(0,10);
let staminaMemory=null, resumeRecovery=null;
function readStamina(){
 let value=staminaMemory;try{const raw=localStorage.getItem(STAMINA_KEY)||localStorage.getItem('night-queen-stamina-v1');if(raw)value=JSON.parse(raw)}catch{}
 const now=Date.now(),day=japanDay();
 let energy=clamp(Number.isFinite(value?.energy)?value.energy:100,0,100);
 let recoveredAt=Number.isFinite(value?.recoveredAt)?Math.min(value.recoveredAt,now):now;
 const ticks=Math.floor((now-recoveredAt)/RECOVERY_MS);
 energy=Math.min(100,energy+ticks*RECOVERY_POINTS);
 recoveredAt=energy===100?(value?.energy===100?recoveredAt:now):recoveredAt+ticks*RECOVERY_MS;
 const result={day,used:value?.day===day?clamp(Math.floor(Number(value.used)||0),0,2):0,energy,recoveredAt};
 if(JSON.stringify(value)!==JSON.stringify(result))writeStamina(result);return result;
}
function writeStamina(value){staminaMemory=value;try{localStorage.setItem(STAMINA_KEY,JSON.stringify(value))}catch{}}
function saveStamina(){const value=readStamina();if(value.energy===100||s.energy===100)value.recoveredAt=Date.now();value.energy=s.energy;writeStamina(value)}
function syncStamina(){if(s)s.energy=readStamina().energy}

function recoveryStatus(){const value=readStamina();$('recovery-count').textContent='無料回復 あと'+(2-value.used)+'回 / 今日';$('energy').classList.toggle('stamina-low',s.energy<=20);$('recovery-status').textContent='スタミナ '+s.energy+' / 100　無料回復：あと'+(2-value.used)+'回';$('recovery-timer').textContent=s.energy>=100?'スタミナは満タンです。':'自然回復：あと'+Math.max(1,Math.ceil((RECOVERY_MS-(Date.now()-value.recoveredAt))/1000))+'秒で＋5（最大100）';$('recover-resume').disabled=s.energy<=0;$('recover-free').disabled=value.used>=2||s.energy>=100;$('recover-free').textContent=s.energy>=100?'スタミナは満タンです':value.used>=2?'本日の無料回復は使い切りました':'無料で100まで回復（あと'+(2-value.used)+'回）';}
function openRecovery(resume=null){syncStamina();resumeRecovery=resume;recoveryStatus();if(!$('recovery-dialog').open)$('recovery-dialog').showModal()}
function freeRecovery(){
 const value=readStamina();s.energy=value.energy;
 if(value.used>=2||value.energy>=100){recoveryStatus();return}
 value.used++;value.energy=100;value.recoveredAt=Date.now();writeStamina(value);s.energy=100;
 const resume=resumeRecovery;resumeRecovery=null;$('recovery-dialog').close();update();if(resume)resume();
}

 if(kind==='extend'){s.extended=true;return act(2,'「もう少し話そう。延長をお願いします。」',amount,2)}
 s.orderCount++;s.drunk++;act(kind==='bottle'?3:2,kind==='bottle'?'「好みを覚えてくれたんだね。それなら一本お願いしよう。」':'「それを一杯、お願いします。」',amount,0);
}
function offerOrder(chance=false){s.chanceUsed=chance||s.chanceUsed;let sober=!s.noAlcohol&&s.drunk<2;
 let options=[
 [sober?'ドリンクを提案する ¥5,000':'ノンアルコールを提案する ¥1,500',()=>sober?order('drink'):act(3,'「それなら飲みたいな。お願いします。」',Math.min(1500,s.budget),0)],
 [sober?'好みを聞いてボトルを提案する ¥35,000':'飲み物を増やさず会話を続ける',()=>sober?order('bottle'):act(4,say(2),0,0)],
 [!s.extended?'延長を提案する ¥12,000':'今回は見送る',()=>!s.extended?order('extend'):leave('「'+voice(s.g,'bye')+'」')],
 ['予算を無視して注文を迫る',()=>act(-24,say(5),0,0)]];
 show(s.g,'注文',chance?'「もう少し一緒に話していたいな。」':sober?'「おすすめの飲み物はある？」':'「お酒はこの辺にして、少しゆっくりしたいな。」',chance?'CHANCE TIME':'ORDER',options,'残り予算 '+money(s.budget)+' ｜ ボトルは信頼と予算が必要。');}
function talk(){
 if(s.mood<18)return leave('「'+voice(s.g,'change')+'」');
 if(s.turn>=s.stay)return leave('「'+voice(s.g,'bye')+'」');
 if(s.energy<=0)return staminaPause(()=>{s.phase='play';talk()});
 if(s.drunk>=3&&!s.careCount)return show(s.g,'酔ったお客様','「少し飲みすぎたかな。水をもらえる？」','SAFE CARE',[
 ['水を渡して様子を見る',()=>{s.careCount++;s.noAlcohol=true;s.drunk=2;s.turn++;s.energy=clamp(s.energy-2,0,100);show(s.g,'介抱','「水をありがとう。少し落ち着いたよ。」','RECOVERY',[['飲酒せず会話に戻る',talk],['帰宅を手配する',()=>leave('黒服と帰宅の手配をした。')]],'この席では追加の酒は勧めない。')}],
 ['黒服と安全な帰宅を手配する',()=>leave('黒服と帰宅の手配をした。')]],'落ち着くまで様子を見よう。');
 if(s.turn>=s.stay)return leave('「'+voice(s.g,'bye')+'」');
 if(s.turn===0)return show(s.g,'接客開始','「'+(s.first?voice(s.g,'open'):s.stories[s.g.id]?'この前の話、覚えてる？':voice(s.g,'open'))+'」','OPENING',[
 [s.first?'名乗って今日の気分を聞く':s.stories[s.g.id]?'前回聞いた話の続きを尋ねる':'再会の挨拶をして名前を伝える',()=>act(8,say(0),0,0)],
 ['丁寧に挨拶する',()=>act(6,say(1),0,0)],['挨拶してから趣味を尋ねる',()=>act(4,say(2),0,0)],['いきなり高い酒を勧める',()=>act(-20,say(3),0,0)]],s.situation);
 if(s.personalStep===0||s.personalStep===1){if(personalTalk()!==false)return;}
 if(s.turn>=3&&!s.castThisSeat&&(s.energy<35||((s.day+s.seat)%3===0))){s.castThisSeat=true;return castEvent()}
 if(s.topic)return followTalk();
 if(s.mood>=72&&!s.chanceUsed&&s.turn>=3)return offerOrder(true);
 if(s.orderCount<2&&s.turn>=3&&!s.orderOffered){s.orderOffered=true;return offerOrder()}
 if(s.mood<40&&!s.troubleUsed){s.troubleUsed=true;return show(s.g,'不満','「さっきから、あまり話が合わない気がする。」','TROUBLE',[
 ['何が嫌だったか聞いて謝る',()=>act(7,say(1),0,0)],['黒服に席の交代を相談する',()=>leave('黒服に相談し、席を交代した。')],['話題を変えて様子を見る',()=>act(1,say(2),0,0)],['不満を責める',()=>{s.mood=0;act(-20,'「'+voice(s.g,'change')+'」',0,0)}]],'無理な注文や話の遮り方には注意。');}
 freeTalk();
}
function act(delta,reply,earned=0,extra=0){
 s.turn++;s.energy=clamp(s.energy-(4+rnd(2)+(s.hero.age>=37?1:0)-(s.hero.energy===2?1:0)),0,100);
 const social=delta>0?Math.round((s.talkSkill+(s.hero.age>=37?3:0))*.16):0;
 const result=delta>0?Math.max(1,Math.round(delta*(s.mood>=85?.35:s.mood>=70?.65:1))+social):delta;
 s.momentum=clamp(s.momentum+(result>0?1:-2),0,5);s.mood=clamp(s.mood+result,0,100);s.mem[s.g.id]=clamp((s.mem[s.g.id]||0)+Math.round(result/3),-50,50);
 const amt=clamp(earned,0,s.budget);s.budget-=amt;s.money+=amt;s.nightSales+=amt;s.table+=amt;s.stay=clamp(s.stay+extra,0,8);
 if(delta<0){s.topic=null;if(s.personalBranch!=='listen')s.personalStep=2;}
 show(s.g,'反応',reply,s.mood<18?'CHANGE':'REACTION',[[s.mood<18?'席を交代する ▶':'接客を続ける ▶',talk]],'機嫌 '+Math.round(s.mood)+' ｜ 今回の追加 '+money(amt)+' ｜ この席 '+money(s.table),s.mood<18?'怒り':result<0?'不満':s.mood>=75?'笑顔':'通常');
}
function castEvent(){let c=pick(WOMEN.filter(x=>x.id!==s.hero.id&&x.id!=='F01'));s.castCount++;let help=s.energy<35||s.castCount%2===1;
 show(c,'同僚',help?'黒服「'+c.name+'、ヘルプをお願い！」\n'+c.name+'「一緒につかせてもらいますね。」':c.name+'「楽しそう。少しご一緒してもいいですか？」',help?'HELP CALL':'CAST INTERRUPT',[
 ['話題を説明して一緒に接客する',()=>castAct(5,say(0),0)],['ヘルプに任せて休憩する',()=>castAct(-2,'「少し休んでおいで。また話そう。」',5)],['お客様の希望を確認する',()=>castAct(4,say(1),3)],['二人でお客様を取り合う',()=>castAct(-20,say(5),0)]],'同僚：'+c.name+' ｜ '+c.role+' ｜ 休憩するとスタミナ5回復・機嫌2低下。');
}
function castAct(delta,reply,recover){s.energy=clamp(s.energy+recover,0,100);s.mood=clamp(s.mood+delta,0,100);s.mem[s.g.id]=clamp((s.mem[s.g.id]||0)+Math.round(delta/3),-50,50);show(s.g,'同僚イベントの結果',reply,'CAST RESULT',[['接客を続ける ▶',talk]],'機嫌 '+s.mood+' ｜ 体力 '+s.energy,s.mood<18?'怒り':delta<0?'不満':'通常');}
function leave(text){s.topic=null;show(s.g,'退席',text+'\nセット料金・注文・延長の合計 '+money(s.table),'TABLE RESULT',[['次のお客様へ ▶',()=>{s.seat++;s.orderOffered=false;newCustomer()}]],'今夜は残り '+(2-s.seat)+'組。スタミナは席を移っても引き継ぎ。');}
$('showcatalog').onclick=()=>{let el=$('catalog');el.classList.toggle('on');$('showcatalog').textContent=el.classList.contains('on')?'人物一覧を閉じる':'40人の人物一覧';if(el.innerHTML)return;for(const [title,people] of [['男性客20人',MEN],['女性キャスト20人',WOMEN]]){let h=document.createElement('h3');h.textContent=title;el.append(h);let grid=document.createElement('div');grid.className='catalog-grid';for(const p of people){let tile=document.createElement('div');tile.className='tile';let img=document.createElement('img');img.src=PHOTOS[p.id];img.alt=p.name;let name=document.createElement('span');name.textContent=p.name;tile.append(img,name);grid.append(tile)}el.append(grid)}};
$('recover-resume').onclick=()=>{syncStamina();if(s.energy<=0)return recoveryStatus();const resume=resumeRecovery;resumeRecovery=null;$('recovery-dialog').close();update();if(resume)resume()};
setInterval(()=>{if(s){syncStamina();$('energy').textContent=s.energy;recoveryStatus()}},1000);
$('recover-open').onclick=()=>openRecovery();$('recover-free').onclick=freeRecovery;$('recover-close').onclick=()=>{$('recovery-dialog').close();resumeRecovery=null};
window.addEventListener('focus',()=>{if(s){syncStamina();update()}});window.addEventListener('storage',event=>{if(event.key===STAMINA_KEY&&s){syncStamina();update()}});
$('reset').onclick=()=>{if(confirm('最初からやり直しますか？'))start()};start();

</script></body></html>
