*{box-sizing:border-box}body{margin:0;background:#100b15;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}button{font:inherit;cursor:pointer}#app{max-width:510px;min-height:100dvh;margin:auto;background:radial-gradient(ellipse at 50% 20%,#553149 0%,#1b1125 47%,#0c0b14 100%);padding:16px 16px 110px}.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:2px;color:#d8afc4}.brand{font-size:17px;font-weight:900;letter-spacing:4px;color:#ffdaae}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}.hud>div{background:#ffffff10;border:1px solid #ffffff18;border-radius:12px;padding:9px;text-align:center;font-size:10px;color:#ddc5d2}.hud b{display:block;font-size:16px;color:white;margin-top:3px}.scene{border:1px solid #ad718355;border-radius:20px;overflow:hidden;background:linear-gradient(145deg,#3d233b,#17101f);box-shadow:0 20px 70px #0008}.stage{position:relative;height:310px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 25%,#af6c8e88,#2b1b34 55%,#17111e)}.stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 48px,#ffffff04 49px 50px);pointer-events:none}.lights{position:absolute;top:10px;left:12px;font-size:10px;letter-spacing:3px;color:#efb9d4}.avatar{width:220px;height:280px;position:relative;filter:drop-shadow(0 8px 24px #0009);transition:transform .3s}.avatar.happy{animation:bounce .4s}.avatar.angry{animation:shake .35s}.avatar.shy{transform:rotate(-3deg)}@keyframes bounce{50%{transform:translateY(-9px)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.avatar svg{width:100%;height:100%}.nameplate{position:absolute;bottom:9px;left:12px;background:#140e1acc;border:1px solid #ffc5c35e;padding:7px 12px;border-radius:10px;font-weight:700;font-size:13px}.bubble{padding:18px 18px 14px;min-height:142px}.chapter{font-size:10px;letter-spacing:3px;color:#e6b0c8;margin-bottom:9px}.dialog{font-size:16px;line-height:1.8;min-height:70px;white-space:pre-wrap}.sub{color:#d6b6c6;font-size:12px;margin-top:7px}.choices{position:sticky;bottom:0;background:linear-gradient(0deg,#100b15 83%,transparent);padding:13px 0 calc(12px + env(safe-area-inset-bottom));z-index:5}.choice{width:100%;border:1px solid #b27d96;background:#352339;color:#fff;border-radius:13px;padding:14px;text-align:left;margin-top:7px;font-size:14px;min-height:50px}.choice:first-child{background:linear-gradient(100deg,#9d456e,#d68b8e);border-color:#e9b6ae;font-weight:700}.result{margin-top:10px;background:#ffffff0d;padding:12px;border-radius:12px;font-size:13px;line-height:1.7}.bar{height:6px;background:#4a364b;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;background:linear-gradient(90deg,#e88baf,#ffe0a7);height:100%;transition:width .3s}.badge{position:absolute;right:10px;top:10px;background:#231629c9;padding:6px 9px;border-radius:20px;font-size:11px}.footer{text-align:center;font-size:10px;color:#b89fb0;margin-top:15px}
</style></head><body><div id="app"><div class="top"><span class="brand">NIGHT QUEEN</span><span id="day">PROLOGUE</span></div><div class="hud"><div>累計売上<b id="money">¥0</b></div><div>好感度<b id="love">50</b></div><div>体力<b id="hp">100</b></div></div><div class="scene"><div class="stage"><span class="lights">CLUB LUNA · TOKYO</span><div id="avatar" class="avatar"></div><span id="mood" class="badge">STORY</span><div class="nameplate" id="name">運命の始まり</div></div><div class="bubble"><div class="chapter" id="chapter">PROLOGUE · 01</div><div class="dialog" id="dialog">ある春の日、ひとりの女の子が生まれた。\nまだ誰も、彼女の未来を知らない。</div><div class="sub" id="sub">画面下のボタンで進みます。</div><div id="result"></div></div></div><div class="choices" id="choices"></div><div class="footer">選択は売上・好感度・次回来店に影響します · 自動セーブ</div></div><script>

const woman=o==='hero'||o==='rival',g=woman?{hair:o==='rival'?'#20121e':['#251d24','#6a352e','#211b24','#51302d','#30212b'][s.look],skin:'#efc1a7',suit:o==='rival'?'#b42b55':['#e3c5c5','#b92e51','#1b1c2b'][s.dress]}:o;

g.hair=design.hair;

const eyes=happy||shy?'<path d="M75 124Q86 111 99 124M121 124Q134 111 147 124" stroke="#3b2528" stroke-width="4" fill="none"/>':'<ellipse cx="87" cy="124" rx="11" ry="7" fill="#fff5ed"/><ellipse cx="135" cy="124" rx="11" ry="7" fill="#fff5ed"/><circle cx="87" cy="124" r="5" fill="#302129"/><circle cx="135" cy="124" r="5" fill="#302129"/>';
const mouth=angry?'M94 174Q111 159 128 174':happy?'M88 166Q110 196 134 166':shy?'M98 169Q110 178 123 169':'M96 172Q110 176 125 172';
const hair=woman?'<path d="M47 90Q34 8 112 7Q189 9 177 96L187 247L154 247L157 98L65 98L65 247L31 247Z" fill="'+g.hair+'"/><path d="M50 103Q39 40 83 26Q122 9 155 37Q172 53 170 109L155 84Q134 76 117 54Q89 83 62 86Z" fill="'+g.hair+'"/>':'<path d="M58 91Q48 32 91 25Q163 7 171 86L158 76L153 54Q131 61 107 47L74 68Z" fill="'+g.hair+'"/>';
const body=woman?'<path d="M9 280Q16 211 72 203L88 199Q110 225 132 199L150 203Q207 211 213 280Z" fill="'+g.suit+'"/><path d="M83 203Q110 258 137 203L130 224Q110 248 90 224Z" fill="#e4b4a1"/><path d="M61 224Q88 231 93 278M159 224Q132 231 127 278" stroke="#ffffff55" stroke-width="2" fill="none"/><circle cx="56" cy="157" r="6" fill="#f7d5a0"/><circle cx="165" cy="157" r="6" fill="#f7d5a0"/>':'<path d="M0 280Q6 211 66 198L88 191L110 218L132 191L154 198Q213 211 220 280Z" fill="'+g.suit+'"/><path d="M90 200L110 218L130 200L125 280L95 280Z" fill="#f3f1ef"/><path d="M91 200L110 219L98 231L81 203Z" fill="#ffffff"/><path d="M129 200L110 219L122 231L139 203Z" fill="#ffffff"/><path d="M106 222L114 222L118 234L110 244L102 234Z" fill="#823047"/><path d="M110 242L98 280L122 280Z" fill="#823047"/><path d="M67 197L92 202L83 219L105 280L57 280L49 215Z" fill="'+g.suit+'"/><path d="M153 197L128 202L137 219L115 280L163 280L171 215Z" fill="'+g.suit+'"/><path d="M87 200L70 221L86 233L76 243L102 280M133 200L150 221L134 233L144 243L118 280" stroke="#9994a0" stroke-width="2.2" fill="none"/><path d="M56 240L72 240" stroke="#c4a58d" stroke-width="3"/>';
const features='<g transform="translate(110 131) scale('+design.w+' 1) translate(-110 -131)">'+(design.age?'<path d="M65 133Q72 138 78 135M143 135Q150 138 156 133M83 179Q110 186 136 179" stroke="#805c53" stroke-width="2" opacity=".5" fill="none"/>':'')+(design.glasses?'<rect x="70" y="113" width="35" height="25" rx="9" fill="none" stroke="#3a3339" stroke-width="3"/><rect x="115" y="113" width="35" height="25" rx="9" fill="none" stroke="#3a3339" stroke-width="3"/><path d="M105 122L115 122" stroke="#3a3339" stroke-width="3"/>':'')+(design.beard?'<path d="M70 159Q75 202 110 210Q147 203 152 159Q143 198 110 197Q78 198 70 159" fill="#2c2325" opacity=".75"/>':'')+'</g>';
const facial=woman?'<path d="M71 123Q85 111 99 123M122 123Q136 111 149 123" stroke="#211923" stroke-width="1.4" fill="none"/><path d="M94 171Q110 179 127 171" stroke="#b34d64" stroke-width="2" fill="none"/>':(o.age>=38?'<path d="M69 161Q75 192 110 196Q145 192 151 161Q135 201 110 202Q85 201 69 161" fill="#302a2c" opacity=".48"/><path d="M96 156Q103 150 110 155Q117 150 125 156" stroke="#332729" stroke-width="4" fill="none"/>':'');
return '<svg viewBox="0 0 220 280"><defs><linearGradient id="nqskin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="'+g.skin+'"/><stop offset="1" stop-color="#9e665c"/></linearGradient></defs>'+body+hair+'<path d="M91 180L91 211Q110 231 130 211L130 180" fill="url(#nqskin)"/><path d="M62 84Q62 47 110 45Q158 47 158 84L155 158Q142 195 110 201Q78 195 65 158Z" fill="url(#nqskin)"/>'+facial+features+brow+eyes+'<path d="M109 129L104 150L115 153" stroke="#a86c60" stroke-width="2.5" fill="none"/><path d="'+mouth+'" stroke="'+(woman?'#a94360':'#713e40')+'" stroke-width="'+(woman?4:5)+'" fill="'+(happy?'#8b374b':'none')+'" stroke-linecap="round"/>'+(shy?'<ellipse cx="77" cy="156" rx="14" ry="7" fill="#ed8492" opacity=".55"/><ellipse cx="145" cy="156" rx="14" ry="7" fill="#ed8492" opacity=".55"/>':'')+'</svg>';
}
function scene(ch,n,txt,who,m,opts,sub=''){ $('chapter').textContent=ch;$('name').textContent=n;$('dialog').textContent=txt;$('sub').textContent=sub;$('mood').textContent=({happy:'大喜び',angry:'怒り',shy:'照れ',normal:'通常'})[m]||'STORY';$('avatar').className='avatar '+m;$('avatar').innerHTML=face(who,m);$('result').innerHTML='';$('choices').innerHTML='';opts.forEach(([label,fn])=>{let b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=fn;$('choices').appendChild(b)});$('day').textContent=s.phase<3?'PROLOGUE':'DAY '+s.day;$('money').textContent='¥'+s.money.toLocaleString();$('love').textContent=s.love;$('hp').textContent=s.hp;save()}
function birth(){s.phase=0;scene('PROLOGUE · 誕生','生まれた日','小さな産声が、静かな病室に響いた。\n\nこの子の未来には、まだ名前のない物語が待っている。','baby','normal',[['20年後へ ▶',reveal]])}
function reveal(){s.phase=2;s.look=Math.floor(Math.random()*5);scene('20 YEARS LATER','主人公・20歳','20年後。\n\n「私、絶対に人生を変えてみせる」\n\n彼女が選んだのは、眠らない街の世界だった。','hero','normal',[['夜の街へ ▶',first]])}
function first(){s.phase=3;scene('FIRST NIGHT','店長・橘 真理','「今日からあなたもCLUB LUNAの一員よ。\n見た目だけじゃダメ。お客さんの心をつかみなさい」','rival','normal',[['ドレスを選ぶ',dress]])}
function dress(){scene('DRESS ROOM','初出勤の準備','今夜、どんな印象で勝負する？','hero','normal',[['清楚な白系ドレス：信頼＋5',()=>{s.dress=0;s.love+=5;meet()}],['大胆な赤ドレス：売上＋¥2,000',()=>{s.dress=1;s.money+=2000;meet()}],['上品な黒ドレス：体力＋5',()=>{s.dress=2;s.hp=Math.min(100,s.hp+5);meet()}]])}

const topics=[
{title:'仕事と本音',lines:['最近、仕事のことで悩んでいてさ。君ならどうする？','実は誰にも言ってない話があるんだ。','俺の仕事って、どう思う？'],opts:[['最後まで聞き、気持ちを受け止める',12,'「ちゃんと聞いてくれるんだな」'],['具体的な解決策を一緒に考える',8,'「考え方が面白いね」'],['冗談で場を明るくする',3,'「少し気が楽になった」'],['話を遮って自慢話をする',-16,'「俺の話、聞いてた？」']]},
{title:'休日と趣味',lines:['休みの日って何してる？','最近、新しい趣味を探してるんだ。','俺の意外な趣味、聞いてくれる？'],opts:[['相手の趣味を詳しく聞く',12,'「そこまで聞いてくれるの？」'],['自分の趣味と共通点を探す',8,'「一緒に楽しめそうだな」'],['今度のイベントに誘う',4,'「予定を見てみるよ」'],['興味がないと顔に出す',-18,'「つまらなかった？」']]},
{title:'恋愛と距離感',lines:['君はどんな人がタイプ？','俺って、どういう男に見える？','今日は少し寂しい気分でさ。'],opts:[['誠実に答え、相手にも尋ねる',11,'「そういう話ができるのはいいね」'],['少し照れて笑う',8,'「照れるところ、いいね」'],['大げさに褒め続ける',-3,'「それ本音？」'],['他の客と比較してからかう',-17,'「比較するなよ」']]},
{title:'店内の噂',lines:['あのNo.1の麗華ってどんな人？','最近この店、雰囲気変わったね。','他のキャストと仲良いの？'],opts:[['他のキャストの良さも伝える',11,'「感じがいい子だね」'],['自分の目標を語る',9,'「応援したくなるな」'],['秘密を守りながら話す',8,'「信用できるね」'],['ライバルの悪口を言う',-20,'「陰口は嫌いだな」']]},
{title:'将来の夢',lines:['5年後、君はどうなっていたい？','この仕事を選んだ理由は？','夢を持つって大事だよね。'],opts:[['具体的な目標を話す',14,'「芯があるんだね」'],['相手の夢も聞く',11,'「久しぶりに夢を語ったよ」'],['まだ探していると正直に話す',5,'「正直でいいね」'],['適当に話を合わせる',-12,'「本心じゃないだろ？」']]}
];
function shuffle(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function ensureNight(){if(!Array.isArray(s.lineup)||s.lineupDay!==s.day){s.lineup=shuffle(guests.map((_,i)=>i)).slice(0,3);s.lineupDay=s.day;s.seat=0;s.round=0;s.usedTopics=[];s.nightSales=0}if(!s.mem)s.mem={};if(!s.spent)s.spent={};}
function meet(){
s.phase=4;ensureNight();if(s.seat>=s.lineup.length)return end();
let i=s.lineup[s.seat],g=guests[i];s.customer=i;s.round=0;s.usedTopics=[];s.chance=false;s.tableSales=0;s.introduced=!!(s.met&&s.met[i]);if(!s.met)s.met={};s.lastTopic=null;
let arrival=pick([{label:'一軒目・素面',drunk:0,money:1.05,temper:0,stay:0},{label:'二軒目・ほろ酔い',drunk:1,money:1,temper:1,stay:1},{label:'三軒目・かなり酔っている',drunk:3,money:.5,temper:2,stay:-1},{label:'仕事帰り・疲労気味',drunk:0,money:.8,temper:1,stay:-1},{label:'祝いの席・上機嫌',drunk:1,money:1.35,temper:-1,stay:2},{label:'嫌なことがあった夜',drunk:0,money:.7,temper:2,stay:0}]);
s.arrival=arrival;s.drunk=arrival.drunk;s.mood=45+Math.floor(Math.random()*26)-arrival.temper*7+Math.round((s.mem[i]||0)/3);
s.stay=Math.max(2,Math.min(10,4+arrival.stay+Math.floor(Math.random()*4)));s.turn=0;
let spent=s.spent[i]||0;s.remaining=Math.max(0,Math.round(g.budget*arrival.money)-spent);
scene('TABLE '+(s.seat+1)+'/3 · '+arrival.label,g.name+' / '+g.age+'歳','「'+(s.introduced?'また会えたね。':'初めまして。')+' '+(s.introduced?pick([g.line,'今日はまた話せて嬉しいよ。']):'今日の担当は君なんだね。よろしく')+'」',g,'normal',[['接客を始める ▶',talk]],g.type+' · 来店状況は毎回変化');
}
function talk(){
let g=guests[s.customer];if(s.hp<=0)return leave('体力の限界。店長が席を引き継いだ。','normal');
if(s.turn>=s.stay)return leave('「そろそろ帰る時間だ。またな」','normal');
if(s.mood<=12)return leave('「チェンジ。別の子を呼んで」','angry');
if(s.drunk>=4){scene('泥酔・安全対応',g.name,'「もう飲めない……」\nお酒の追加注文は受けず、休憩と帰宅を優先しよう。',g,'normal',[['水を用意して休んでもらう',()=>act(9,'「助かったよ。ありがとう」',0,0)],['黒服を呼んで安全に帰宅を手配',()=>leave('黒服が安全に帰宅を手配した。','normal')],['体調を確認する',()=>act(7,'「少し落ち着いた」',0,0)],['今日はここで席を終える',()=>leave('無理せず営業を終えた。','normal')]],'泥酔時は注文不可');return}
let event=Math.random(),options=[],line='',tag='FREE TALK',kind='talk';if(s.turn===0&&!s.introduced){tag='初対面・自己紹介';kind='intro';line='「まずは名前を教えてくれる？」';options=[['笑顔で名乗り、今日の気分を尋ねる',()=>act(12,'「よろしく。今日は話したい気分なんだ」',0,0)],['名乗って仕事の話を聞く',()=>act(8,'「仕事の話ならたくさんあるよ」',0,0)],['丁寧に挨拶する',()=>act(9,'「礼儀正しいね」',0,0)],['挨拶せず注文を迫る',()=>act(-20,'「まずは自己紹介じゃない？」',0,0)]];}else 
if(s.chance&&event<.48){tag='CHANCE TIME';line='「今日は楽しいな。もう少しここにいたい！」';kind='chance';options=[['延長を提案する',()=>act(12,'「よし、もう少し話そう！」',s.drunk>=3?0:Math.min(24000,s.remaining),2)],['記念のボトルを相談する',()=>act(s.drunk>=2?-3:12,'「今日は特別な夜だ」',s.drunk>=2?0:Math.min(56000,s.remaining),0)],['話をじっくり聞く',()=>act(10,'「君と話すのが楽しい」',0,1)],['盛り上がっているうちに切り上げる',()=>leave('「また指名するよ」','happy')]]}
else if(event<.25){tag='突然のトラブル';kind='trouble';line=pick(['「隣の席、ずいぶん盛り上がってるね」','「さっきから少し落ち着かないんだ」','「今日は何だか調子が出ないな」']);options=[['まず謝って事情を聞く',()=>act(11,'「ちゃんと話してくれるんだな」',0,0)],['冗談でごまかす',()=>act(-8,'「ふざけてるのか？」',0,0)],['店長に助けを求める',()=>act(4,'店長が間に入って落ち着いた。',0,0)],['反論して押し切る',()=>act(-24,'「もういい。チェンジ！」',0,0)]]}
else if(event<.55){tag='注文・駆け引き';kind='order';line=pick(['「今日は何を飲もうかな」','「何かおすすめある？」','「もう少し楽しめるかな？」']);options=[['予算に合うドリンクを提案',()=>act(8,'「それなら頼もう」',Math.min(7000,s.remaining),0)],['好みを聞いてボトルを選ぶ',()=>act(s.drunk>=2?1:9,'「それ、良さそうだね」',s.drunk>=2?0:Math.min(32000,s.remaining),0)],['注文せず会話を楽しむ',()=>act(11,'「気遣いが嬉しいよ」',0,1)],['高額注文を強く迫る',()=>act(-22,'「金の話ばかりだな」',0,0)]]}
else {let available=topics.map((_,i)=>i).filter(i=>!s.usedTopics.includes(i));if(!available.length){s.usedTopics=[];available=topics.map((_,i)=>i)}let ti=pick(available),t=topics[ti];s.usedTopics.push(ti);tag=t.title;line=pick(t.lines);options=t.opts.map(o=>[o[0],()=>act(o[1],o[2],0,0)]);}
s.currentKind=kind;
let situ='来店：'+s.arrival.label+' ｜ 機嫌 '+Math.max(0,Math.min(100,s.mood))+' ｜ 残り時間 '+Math.max(0,s.stay-s.turn)+' ｜ '+(s.chance?'★ チャンスタイム中':'通常接客');
scene(tag+' · '+(s.turn+1)+'回目',g.name,'「'+line+'」',g,s.mood<28?'angry':s.mood>75?'happy':'normal',options,situ);
}
function act(delta,line,amount,extra){
let g=guests[s.customer];if(s.currentKind==='intro'){s.met[s.customer]=true;s.introduced=true;}s.turn++;s.hp=Math.max(0,s.hp-5-Math.floor(Math.random()*5));
let adjusted=delta+(s.drunk>=2&&delta<0?-4:0)+(Math.random()<.12?-6:0);
s.mood=Math.max(0,Math.min(100,s.mood+adjusted));s.mem[s.customer]=(s.mem[s.customer]||0)+Math.round(adjusted/2);
s.love=Math.max(0,Math.min(100,s.love+Math.round(adjusted/3)));
let earned=Math.max(0,Math.min(amount,s.remaining));s.remaining-=earned;s.money+=earned;s.nightSales=(s.nightSales||0)+earned;s.tableSales+=earned;s.spent[s.customer]=(s.spent[s.customer]||0)+earned;
if(extra)s.stay=Math.min(12,s.stay+extra);
if(s.mood>=77&&Math.random()<.65){s.chance=true;s.stay=Math.min(12,s.stay+1)}
if(s.mood<22&&Math.random()<.65){s.mood=0}
if(s.drunk<3&&Math.random()<.13)s.drunk++;
let mood=s.mood<=22?'angry':adjusted>=8?'happy':adjusted>=3?'shy':'normal';
let next=s.mood<=12?()=>leave('「チェンジ！」\n不機嫌になり、指名を外された。','angry'):s.turn>=s.stay?()=>leave('「そろそろ帰る。また会おう」','normal'):talk;
scene(s.mood<=12?'CHANGE 発生':s.chance?'★ CHANCE TIME':'REACTION · '+s.turn+'回目',g.name,line,g,mood,[['次へ ▶',next]],'機嫌 '+s.mood+' ｜ 今回の売上 +¥'+earned.toLocaleString()+' ｜ 残り時間 '+Math.max(0,s.stay-s.turn));
}
function leave(line,mood){
let g=guests[s.customer];scene('退席 · 接客 '+s.turn+'回',g.name,line+'\n\nこの席の売上 ¥'+s.tableSales.toLocaleString(),g,mood,[['次の席へ ▶',()=>{s.seat++;meet()}]],s.mood<=12?'チェンジ発生：次回来店時の関係に悪影響':'次回来店時に今回の関係が引き継がれる');
}
function end(){
s.phase=5;scene('NIGHT RESULT','DAY '+s.day+' 営業終了','今夜は3組を接客した。\n今夜の売上 ¥'+(s.nightSales||0).toLocaleString()+'\n累計売上 ¥'+s.money.toLocaleString()+'\n\n明日の客・酔い具合・会話はまた変わる。','hero','normal',[['翌日の営業へ ▶',()=>{s.day++;s.hp=Math.min(100,s.hp+30);s.lineupDay=null;meet()}],['最初から遊ぶ',()=>{localStorage.removeItem('nightqueen-v2');s={phase:0,day:1,money:0,love:50,hp:100,look:0,customer:0,mem:{},dress:0};birth()}]])}
if(s.phase>=2){scene('WELCOME BACK','NIGHT QUEEN','前回の続きから遊べます。','hero','normal',[['続きをプレイ',()=>{if(s.phase===2)first();else if(s.phase===5)end();else meet()}],['最初から',()=>{s={phase:0,day:1,money:0,love:50,hp:100,look:0,customer:0,mem:{},dress:0};birth()}]])}else birth();
