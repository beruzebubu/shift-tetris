const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)],money=n=>'¥'+Math.round(n).toLocaleString('ja-JP');

const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let s;
const RECOVERY_MS=60000, RECOVERY_POINTS=5;
const STAMINA_KEY='night-queen-stamina-v2';
const japanDay=()=>new Date(Date.now()+9*60*60*1000).toISOString().slice(0,10);
let staminaMemory=null, resumeRecovery=null;
function readStamina(){
 let value=staminaMemory;try{const raw=localStorage.getItem(STAMINA_KEY)||localStorage.getItem('night-queen-stamina-v1');if(raw)value=JSON.parse(raw)}catch{}
 const now=Date.now(),day=japanDay();
 let energy=clamp(Number.isFinite(value?.energy)?value.energy:100,0,100);
 let recoveredAt=Number.isFinite(value?.recoveredAt)?Math.min(value.recoveredAt,now):now;
 const ticks=Math.floor((now-recoveredAt)/RECOVERY_MS);
 energy=Math.min(100,energy+ticks*RECOVERY_POINTS);
 recoveredAt=energy===100?(value?.energy===100?recoveredAt:now):recoveredAt+ticks*RECOVERY_MS;
 const result={day,used:value?.day===day?clamp(Math.floor(Number(value.used)||0),0,2):0,energy,recoveredAt};
 if(JSON.stringify(value)!==JSON.stringify(result))writeStamina(result);return result;
}
function writeStamina(value){staminaMemory=value;try{localStorage.setItem(STAMINA_KEY,JSON.stringify(value))}catch{}}
function saveStamina(){const value=readStamina();if(value.energy===100||s.energy===100)value.recoveredAt=Date.now();value.energy=s.energy;writeStamina(value)}
function syncStamina(){if(s)s.energy=readStamina().energy}

}

function customerExpression(p,phase,mood,explicit){
 if(!p.id.startsWith('M'))return 'neutral';
 if(EXPRESSION_NAMES[explicit])return explicit;
 if(phase==='CHANGE'||phase==='TROUBLE'||mood==='怒り'||mood==='不満')return 'anger';
 if(phase.startsWith('PERSONAL')&&WORRIED_GUESTS.has(p.id))return 'sadness';
 if(mood==='笑顔'||phase==='CHANCE TIME')return 'joy';
 if(phase.startsWith('TABLE ')&&s.situation?.includes('祝い'))return 'joy';
 return 'neutral';
}
function renderPortrait(p,emotion){
 const img=$('portrait'),request=++portraitRequest;
 img.src=PHOTOS[p.id];img.alt=p.name+'（通常）';img.dataset.expression='neutral';
 if(!p.id.startsWith('M')||!EXPRESSION_CELLS[emotion])return;
 const key=p.id+':'+emotion;
 const apply=src=>{if(request!==portraitRequest)return;img.src=src;img.alt=p.name+'（'+EXPRESSION_NAMES[emotion]+'）';img.dataset.expression=emotion};
 if(expressionFaces.has(key)){apply(expressionFaces.get(key));return}
 if(!expressionSheets.has(p.id)){
  const pending=new Promise((resolve,reject)=>{const sheet=new Image();sheet.onload=()=>resolve(sheet);sheet.onerror=()=>reject(new Error('Expression image unavailable'));sheet.src='./expressions/'+p.id+'.webp?v=1'});
  expressionSheets.set(p.id,pending);if(expressionSheets.size>3)expressionSheets.delete(expressionSheets.keys().next().value);
 }
 expressionSheets.get(p.id).then(sheet=>{
  const [x,y]=EXPRESSION_CELLS[emotion],w=sheet.naturalWidth/2,h=sheet.naturalHeight/2,canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');if(!ctx)return;ctx.drawImage(sheet,x*w,y*h,w,h,0,0,w,h);
  const src=canvas.toDataURL('image/webp',.9);expressionFaces.set(key,src);if(expressionFaces.size>12)expressionFaces.delete(expressionFaces.keys().next().value);apply(src);
 }).catch(()=>{expressionSheets.delete(p.id)});
}

 $('mood').textContent=p.id.startsWith('M')?EXPRESSION_NAMES[face]:mood;$('phase').textContent=phase;$('line').textContent=dialog;$('sub').textContent=sub+(p.id.startsWith('M')&&s.insights?.[p.id]?.length?' ｜ 客メモ：'+s.insights[p.id].slice(-2).join('・'):'');$('choices').replaceChildren();

const DRINKS=[{"id":"beer","name":"ビール","price":1500,"group":"glass","taste":"beer","alcohol":true},{"id":"cocktail","name":"カクテル","price":3000,"group":"glass","taste":"cocktail","alcohol":true},{"id":"cast-glass","name":"キャストと乾杯セット","price":5000,"group":"glass","taste":"cocktail","alcohol":true},{"id":"shochu-house","name":"ハウス焼酎","price":8000,"group":"shochu","taste":"shochu","alcohol":true},{"id":"shochu-select","name":"厳選焼酎","price":15000,"group":"shochu","taste":"shochu","alcohol":true},{"id":"shochu-reserve","name":"プレミアム焼酎","price":25000,"group":"shochu","taste":"shochu","alcohol":true},{"id":"whisky-house","name":"ハウスウイスキー","price":12000,"group":"whisky","taste":"whisky","alcohol":true},{"id":"whisky-select","name":"熟成ウイスキー","price":35000,"group":"whisky","taste":"whisky","alcohol":true},{"id":"whisky-reserve","name":"希少ウイスキー","price":70000,"group":"whisky","taste":"whisky","alcohol":true},{"id":"champagne-house","name":"ハウスシャンパン","price":20000,"group":"champagne","taste":"champagne","alcohol":true},{"id":"champagne-rose","name":"ロゼシャンパン","price":50000,"group":"champagne","taste":"champagne","alcohol":true},{"id":"champagne-vintage","name":"ヴィンテージシャンパン","price":100000,"group":"champagne","taste":"champagne","alcohol":true},{"id":"tea","name":"お茶・炭酸水","price":1000,"group":"soft","taste":"soft","alcohol":false},{"id":"soft-cocktail","name":"ノンアルカクテル","price":1500,"group":"soft","taste":"soft","alcohol":false},{"id":"soft-special","name":"フルーツノンアルセット","price":3000,"group":"soft","taste":"soft","alcohol":false}];
const DRINK_PREFERENCES={"M01":"whisky","M02":"shochu","M03":"whisky","M04":"beer","M05":"whisky","M06":"champagne","M07":"shochu","M08":"cocktail","M09":"champagne","M10":"beer","M11":"shochu","M12":"champagne","M13":"whisky","M14":"whisky","M15":"whisky","M16":"soft","M17":"shochu","M18":"beer","M19":"champagne","M20":"beer"};
const DRINK_GROUP_NAMES={glass:'一杯のドリンク',beer:'ビール',cocktail:'カクテル',shochu:'焼酎',whisky:'ウイスキー',champagne:'シャンパン',soft:'ノンアルコール'};
function alcoholAllowed(){return !s.noAlcohol&&s.drunk<2}
function order(kind){
 if(kind==='extend'){
  if(s.extended)return act(0,'「延長はもうお願いしてあるよ。」',0,0,'neutral');
  const decision=purchaseDecision(12000,'extend');discoverGuest('wallet');if(!decision.ok)return act(0,decision.reply,0,0,'neutral');
  s.extended=true;return act(2,'「もう少し話そう。延長をお願いします。」',12000,2);
 }
 const id=({drink:'cast-glass',bottle:'whisky-select',soft:'soft-cocktail'})[kind]||kind,drink=DRINKS.find(d=>d.id===id);
 if(!drink)return;
 if(drink.alcohol&&!alcoholAllowed())return show(s.g,'飲み物の相談','「お酒はこの辺にしておきたいな。」','DRINK MENU',[[ 'ノンアルコールから選ぶ',()=>drinkMenu('soft')],['注文メニューに戻る',()=>offerOrder()]],'お酒の注文は増やさず、飲まない選択もできる。');
 const fit=DRINK_PREFERENCES[s.g.id]===drink.taste?6:0;
 const bottle=['shochu','whisky','champagne'].includes(drink.group);
 const decision=purchaseDecision(drink.price,drink.alcohol?(bottle?'bottle':'glass'):'soft',fit);discoverGuest('wallet');
 if(!decision.ok)return act(0,decision.reply,0,0,'neutral');
 s.orderCount++;if(drink.alcohol)s.drunk++;
 const favorite=fit>0?'好みに合うものを選んでくれたんだね。':'それなら飲みたいな。';
 act((bottle?3:2)+(fit?2:0),'「'+favorite+' '+drink.name+'を'+money(drink.price)+'でお願いします。」',drink.price,0);
}
function drinkMenu(group){
 if(group!=='soft'&&!alcoholAllowed())group='soft';
 const drinks=DRINKS.filter(d=>d.group===group);
 show(s.g,'ドリンクメニュー',DRINK_GROUP_NAMES[group]+'から、どれを提案する？','DRINK MENU',[
 ...drinks.map(d=>[d.name+' '+money(d.price),()=>order(d.id)]),['ひとつ前のメニューに戻る',()=>['shochu','whisky','champagne'].includes(group)?bottleMenu():offerOrder()]
 ],'残り予算 '+money(s.budget)+' ｜ 好み：'+(s.knownDrinks?.[s.g.id]?DRINK_GROUP_NAMES[DRINK_PREFERENCES[s.g.id]]:'まだ聞いていない')+' ｜ 見る・戻る操作では体力を消費しない。');
}
function bottleMenu(){if(!alcoholAllowed())return drinkMenu('soft');show(s.g,'ボトルメニュー','どんな種類のボトルを提案する？','BOTTLE MENU',[
 ['焼酎 ¥8,000〜¥25,000',()=>drinkMenu('shochu')],['ウイスキー ¥12,000〜¥70,000',()=>drinkMenu('whisky')],['シャンパン ¥20,000〜¥100,000',()=>drinkMenu('champagne')],['注文メニューに戻る',()=>offerOrder()]
 ],'残り予算 '+money(s.budget)+' ｜ 値段・好み・信頼の積み重ねで注文の受けやすさが変わる。');}
function askDrinkPreference(){
 const taste=DRINK_PREFERENCES[s.g.id],label=DRINK_GROUP_NAMES[taste];s.knownDrinks??={};s.knownDrinks[s.g.id]=true;
 const polite=GUEST_TONE[s.g.id]==='polite';
 show(s.g,'飲み物の好み','「'+(taste==='soft'?'飲むならノンアルコールがいい'+(polite?'ですね。':'な。'):label+'が好み'+(polite?'です。':'だな。'))+'」','DRINK · 好み',[
 ['好みに合うメニューを見る',()=>drinkMenu(taste==='beer'||taste==='cocktail'?'glass':taste)],['注文メニューに戻る',()=>offerOrder()]
 ],'好みを覚えた：'+label+' ｜ 好きな種類でも、高すぎる注文は断られる。');
}
function orderServices(){show(s.g,'注文の相談','飲み物以外の希望も確認しよう。','ORDER · 相談',[
 [s.extended?'延長は注文済み':'延長を提案する ¥12,000',()=>s.extended?offerOrder():order('extend')],['好きな飲み物を聞く',askDrinkPreference],['注文せず会話を続ける',()=>act(3,'「今ある飲み物で、もう少し話そう。」',0,0)],['注文メニューに戻る',()=>offerOrder()]
 ],'無理な注文をせず、相手に合わせて選ぼう。');}
function offerOrder(chance=false){s.chanceUsed=chance||s.chanceUsed;
 const sober=alcoholAllowed();
 show(s.g,'注文',chance?'「もう少し一緒に話していたいな。」':sober?'「飲み物、どんなものがある？」':'「お酒はこの辺にしておきたいな。」',chance?'CHANCE TIME':'ORDER',sober?[
 ['一杯のドリンク ¥1,500〜¥5,000',()=>drinkMenu('glass')],['ボトル・シャンパン ¥8,000〜¥100,000',bottleMenu],['ノンアルコール ¥1,000〜¥3,000',()=>drinkMenu('soft')],['好み・延長・注文見送り',orderServices]
 ]:[['ノンアルコール ¥1,000〜¥3,000',()=>drinkMenu('soft')],['好きな飲み物を聞く',askDrinkPreference],['飲み物を増やさず会話を続ける',()=>act(4,say(2),0,0)],['延長・注文見送り',orderServices]],'残り予算 '+money(s.budget)+' ｜ 15種類。高額注文は金銭感覚・信頼・好み次第。');}
function talk(){
 if(s.mood<18)return leave('「'+voice(s.g,'change')+'」');
 if(s.turn>=s.stay)return leave('「'+voice(s.g,'bye')+'」');
 if(s.energy<=0)return staminaPause(()=>{s.phase='play';talk()});
 if(s.drunk>=3&&!s.careCount)return show(s.g,'酔ったお客様','「少し飲みすぎたかな。水をもらえる？」','SAFE CARE',[
 ['水を渡して様子を見る',()=>{s.careCount++;s.noAlcohol=true;s.drunk=2;s.turn++;s.energy=clamp(s.energy-2,0,100);show(s.g,'介抱','「水をありがとう。少し落ち着いたよ。」','RECOVERY',[['飲酒せず会話に戻る',talk],['帰宅を手配する',()=>leave('黒服と帰宅の手配をした。')]],'この席では追加の酒は勧めない。')}],
 ['黒服と安全な帰宅を手配する',()=>leave('黒服と帰宅の手配をした。')]],'落ち着くまで様子を見よう。');
 if(s.turn>=s.stay)return leave('「'+voice(s.g,'bye')+'」');
 if(s.turn===0)return show(s.g,'接客開始','「'+(s.first?voice(s.g,'open'):s.stories[s.g.id]?'この前の話、覚えてる？':voice(s.g,'open'))+'」','OPENING',[
 [s.first?'名乗って今日の気分を聞く':s.stories[s.g.id]?'前回聞いた話の続きを尋ねる':'再会の挨拶をして名前を伝える',()=>act(8,say(0),0,0)],
 ['丁寧に挨拶する',()=>act(6,say(1),0,0)],['挨拶してから趣味を尋ねる',()=>act(4,say(2),0,0)],['いきなり高い酒を勧める',()=>act(-20,say(3),0,0)]],s.situation);
 if(s.personalStep===0||s.personalStep===1){if(personalTalk()!==false)return;}
 if(s.turn>=3&&!s.castThisSeat&&(s.energy<35||((s.day+s.seat)%3===0))){s.castThisSeat=true;return castEvent()}
 if(s.topic)return followTalk();
 if(s.turn>=4&&s.mood>=65&&!s.humorUsed){s.humorUsed=true;return show(s.g,'和んだ席','「少し気が楽になったよ。何か楽しい話はある？」','LIGHT TALK',[[
 '軽い冗談で一緒に笑う',()=>act(6,'「ははは！ それは面白い。今日は来てよかったよ。」',0,0,'laughter')],['相手の好きな話題を聞く',()=>act(7,say(2),0,0)],['落ち着いて会話を続ける',()=>act(4,say(1),0,0)],['からかって笑いを取ろうとする',()=>act(-16,say(5),0,0)]],'相手を傷つけずに、楽しい空気を作ろう。');}
 if(s.mood>=72&&!s.chanceUsed&&s.turn>=3)return offerOrder(true);
 if(s.orderCount<2&&s.turn>=3&&!s.orderOffered){s.orderOffered=true;return offerOrder()}
 if(s.mood<40&&!s.troubleUsed){s.troubleUsed=true;return show(s.g,'不満','「さっきから、あまり話が合わない気がする。」','TROUBLE',[
 ['何が嫌だったか聞いて謝る',()=>act(7,say(1),0,0)],['黒服に席の交代を相談する',()=>leave('黒服に相談し、席を交代した。')],['話題を変えて様子を見る',()=>act(1,say(2),0,0)],['不満を責める',()=>{s.mood=0;act(-20,'「'+voice(s.g,'change')+'」',0,0)}]],'無理な注文や話の遮り方には注意。');}
 freeTalk();
}
function act(delta,reply,earned=0,extra=0,emotion=null){
 s.turn++;s.energy=clamp(s.energy-(4+rnd(2)+(s.hero.age>=37?1:0)-(s.hero.staminaSave||0)),0,100);
 const personality=guestTraits();if(delta<0)discoverGuest('temper');
 const social=delta>0?Math.round((s.talkSkill+(s.hero.age>=37?3:0))*.16)+Math.floor(personality.warmth/2):0;
 const result=delta>0?Math.max(1,Math.round(delta*(s.mood>=85?.35:s.mood>=70?.65:1))+social):delta<0?Math.round(delta*personality.temper):0;
 s.momentum=clamp(s.momentum+(result>0?1:-2),0,5);s.mood=clamp(s.mood+result,0,100);s.mem[s.g.id]=clamp((s.mem[s.g.id]||0)+Math.round(result/3),-50,50);
 const amt=clamp(earned,0,s.budget);s.budget-=amt;s.money+=amt;s.nightSales+=amt;s.table+=amt;s.stay=clamp(s.stay+extra,0,8);
 if(delta<0){s.topic=null;if(s.personalBranch!=='listen')s.personalStep=2;}
 show(s.g,'反応',reply,s.mood<18?'CHANGE':'REACTION',[[s.mood<18?'席を交代する ▶':'接客を続ける ▶',talk]],'機嫌 '+Math.round(s.mood)+' ｜ 今回の追加 '+money(amt)+' ｜ この席 '+money(s.table),s.mood<18?'怒り':result<0?'不満':s.mood>=75?'笑顔':'通常',emotion||(result<0?'anger':result>0?'joy':'neutral'));
}
function castEvent(){
 if(!s.castDeck.length)s.castDeck=shuffle(WOMEN.filter(x=>x.id!==s.hero.id&&x.id!=='F01'));
 const c=s.castDeck.pop(),v=CAST_VOICES[c.id];s.castCount++;const help=s.energy<35||s.castCount%2===1;
 show(c,'同僚',c.name+'「'+v.entry+'」',help?'HELP CALL':'CAST INTERRUPT',[
 ['役割を分けて協力する',()=>castScene(c,'team')],
 ['丁寧な接客をお願いする',()=>castScene(c,'formal')],
 ['小声で本音を聞いて息を合わせる',()=>castScene(c,'gap')],
 ['ヘルプに任せて少し休む',()=>castScene(c,'rest')]
 ],v.style+' ｜ 協力注文も相手の金銭感覚と予算次第。追加の体力消費なし。');
}
function castScene(c,mode){
 const v=CAST_VOICES[c.id];let text=mode==='rest'?'「'+v.team+'」':mode==='gap'?'あなた「いつもと雰囲気が違うね」\n'+c.name+'（小声）「'+v.gap+'」':c.name+'「'+v[mode]+'」';
 const good=mode!=='rest';
 if(good)s.castBond[c.id]=Math.min(3,(s.castBond[c.id]||0)+1);
 show(c,'同僚との連携',text,mode==='gap'?'CAST · 素顔':mode==='formal'?'CAST · 接客モード':'CAST · 連携',[
 [good?'二人で好みに合う飲み物を提案する':'お客様の席に戻る',()=>castResolve(c,mode)],
 [good?'注文は勧めず、会話を支える':'休まず一緒に接客する',()=>castResolve(c,'listen')]
 ],c.name+'との連携 '+(s.castBond[c.id]||0)+'/3 ｜ '+(good?'協力セット '+money((s.noAlcohol||s.drunk>=2?3000:6000)+((s.castBond[c.id]||0)>=2?3000:0))+'・残り予算 '+money(s.budget):'休憩は体力＋5・機嫌−2。'));
}
function castResolve(c,mode){
 const rest=mode==='rest',listen=mode==='listen',sober=s.noAlcohol||s.drunk>=2;
 const price=sober?3000:6000;
 const bonus=(s.castBond[c.id]||0)>=2?3000:0;
 const amount=price+bonus;
 let earned=0,reply,delta=rest?-2:listen?4:5;
 if(rest){s.energy=clamp(s.energy+5,0,100);reply='「おかえり。少し休めた？ 話の続きをしよう。」'}
 else if(listen)reply='「注文を急かさずに聞いてくれるのは、うれしいね。」';
 else if(!purchaseDecision(amount,sober?'soft':'team').ok){discoverGuest('wallet');reply=purchaseDecision(amount,sober?'soft':'team').reply;delta=0}
 else {discoverGuest('wallet');earned=amount;if(!sober)s.drunk++;s.orderCount++;reply='「二人で選んでくれた'+(sober?'ノンアルコール':'ドリンク')+'、いいね。'+money(amount)+'のセットでお願い。」'}
 s.budget-=earned;s.money+=earned;s.nightSales+=earned;s.table+=earned;
 s.mood=clamp(s.mood+delta,0,100);s.mem[s.g.id]=clamp((s.mem[s.g.id]||0)+Math.round(delta/3),-50,50);
 show(s.g,'連携の結果',reply,'CAST RESULT',[['接客を続ける ▶',talk]],'協力売上 '+money(earned)+' ｜ この席 '+money(s.table)+' ｜ '+(rest?'体力＋5':'追加の体力消費なし'),delta<0?'不満':'通常',delta<0?'anger':earned>0?'joy':null);
}
function leave(text){s.topic=null;show(s.g,'退席',text+'\nセット料金・注文・延長の合計 '+money(s.table),'TABLE RESULT',[['次のお客様へ ▶',()=>{s.seat++;s.orderOffered=false;newCustomer()}]],'今夜は残り '+(2-s.seat)+'組。スタミナは席を移っても引き継ぎ。');}
$('showcatalog').onclick=()=>{let el=$('catalog');el.classList.toggle('on');$('showcatalog').textContent=el.classList.contains('on')?'人物一覧を閉じる':'40人の人物一覧';if(el.innerHTML)return;for(const [title,people] of [['男性客20人',MEN],['女性キャスト20人',WOMEN]]){let h=document.createElement('h3');h.textContent=title;el.append(h);let grid=document.createElement('div');grid.className='catalog-grid';for(const p of people){let tile=document.createElement('div');tile.className='tile';let img=document.createElement('img');img.src=PHOTOS[p.id];img.alt=p.name;let name=document.createElement('span');name.textContent=p.name;tile.append(img,name);if(CAST_VOICES[p.id]){let detail=document.createElement('small');detail.textContent=CAST_VOICES[p.id].style;detail.style.cssText='display:block;padding:0 6px 8px;font-size:10px;line-height:1.5;color:#e5bed1';tile.append(detail)};grid.append(tile)}el.append(grid)}};
