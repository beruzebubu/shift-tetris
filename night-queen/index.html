function talk(){if(s.energy<=0)return leave('体力の限界。黒服が席を引き継いだ。');if(s.turn>=s.stay)return leave('「'+voice(s.g,'bye')+'」');if(s.mood<13)return leave('「'+voice(s.g,'change')+'」');if(s.drunk>=4)return show(s.g,'泥酔','「もう飲めない……」\n安全のため、飲酒の追加注文は控えよう。','SAFE CARE',[['水を用意して休んでもらう',()=>act(8,'「ありがとう」',0,0)],['黒服に帰宅の手配を頼む',()=>leave('安全に帰宅を手配した')],['体調を確認する',()=>act(6,'「少し落ち着いた」',0,0)]],'泥酔中の高額注文は受けない。');
 if(s.turn>=2&&!s.castThisSeat&&Math.random()<.2){s.castThisSeat=true;return castEvent()}
 if(s.turn===0){let g=s.g;return show(g,'接客開始','「'+(s.first?voice(s.g,'open'):voice(s.g,'back'))+'」','OPENING',s.first?[['名乗って今日の気分を聞く',()=>act(12,'「話しやすいね」',0,0)],['丁寧に挨拶する',()=>act(8,'「礼儀正しいね」',0,0)],['趣味を尋ねる',()=>act(7,'「じゃあ少し話そう」',0,0)],['いきなり高い酒を勧める',()=>act(-20,'「まだ早いよ」',0,0)]]:[['前回の話を思い出して聞く',()=>act(13,'「覚えててくれたんだ」',0,0)],['最近どうしていたか聞く',()=>act(9,'「気にかけてくれるんだ」',0,0)],['今日はどんな気分か聞く',()=>act(8,'「今日はね……」',0,0)],['初対面のように接する',()=>act(-12,'「俺のこと忘れた？」',0,0)]],s.situation);}
 let v=Math.random();if(s.topic&&v<.65){let t=s.topic;s.topic=null;return show(s.g,'会話の続き','「それで、君はどう思う？」','FOLLOW UP',[['さっきの話を踏まえて答える',()=>act(12,'「ちゃんと聞いてくれてたんだ」',0,0)],['相手の考えをさらに聞く',()=>act(10,'「そうそう、それでね」',0,0)],['冗談を交えて答える',()=>act(4,'「面白いね」',0,0)],['急に注文の話に変える',()=>act(-13,'「話の途中なのに」',0,0)]],'前の会話から自然に続く。');}
 if(s.chance&&v<.4)return show(s.g,'チャンスタイム','「今日は楽しいな。もう少し一緒にいたい！」','★ CHANCE TIME',[['延長を提案する',()=>act(12,'「もう少し楽しもう！」',Math.min(s.budget,12000),2)],['記念ボトルを提案する',()=>act(s.drunk>1?0:11,'「今日は特別だな」',s.drunk>1?0:Math.min(s.budget,35000),0)],['話を深める',()=>act(10,'「君は話しやすいね」',0,1)],['いいところで見送る',()=>leave('「また指名するよ」')]],'盛り上がると売上の機会が増える。');
 if(v<.27)return show(s.g,'注文の相談','「おすすめの飲み物、何かある？」','ORDER',[['予算に合うドリンクを提案',()=>act(8,'「それなら頼もう」',Math.min(s.budget,5000),0)],['好みを聞いてボトルを選ぶ',()=>act(8,'「悪くないね」',s.drunk>=2?0:Math.min(s.budget,22000),0)],['今日は会話を優先する',()=>act(10,'「気が利くね」',0,1)],['高額注文を強く迫る',()=>act(-23,'「もういい」',0,0)]],'残り予算 '+money(s.budget));
 if(v<.4&&s.turn>=2)return show(s.g,'予想外の出来事','「隣の席、少し騒がしいね……」','TROUBLE',[['状況を聞いて落ち着かせる',()=>act(11,'「助かったよ」',0,0)],['黒服に相談する',()=>act(7,'「対応が丁寧だね」',0,0)],['気にしないでと流す',()=>act(-5,'「そういう問題じゃない」',0,0)],['相手を責める',()=>act(-20,'「チェンジしてくれ」',0,0)]],s.situation);
 let t=pick(topics);s.topic=t;return show(s.g,'フリートーク',t.q,'TALK',t.a.map(([label,delta,reply])=>[label,()=>act(delta,reply,0,0)]),'来店：'+s.situation+' ｜ 残り時間 '+(s.stay-s.turn));}
function act(delta,reply,earned,extra){s.turn++;s.energy=Math.max(0,s.energy-5-rnd(4)+(s.hero.energy||0)>0?Math.min(100,s.energy-5-rnd(4)+(s.hero.energy||0)):0);let social=delta>0?Math.round((s.talkSkill||0)*(.35+Math.min(4,s.momentum)*.12)):0;let result=delta+social+(s.drunk>=3&&delta<0?-4:0);s.momentum=result>0?Math.min(6,s.momentum+1):Math.max(0,s.momentum-2);s.mood=Math.max(0,Math.min(100,s.mood+result));s.mem[s.g.id]=(s.mem[s.g.id]||0)+Math.round(result/2);let amt=Math.max(0,Math.min(earned,s.budget));s.budget-=amt;s.money+=amt;s.table+=amt;s.nightSales+=amt;s.stay=Math.min(12,s.stay+extra);if(s.mood>78&&Math.random()<.55){s.chance=true;s.stay=Math.min(12,s.stay+1)}if(s.momentum>=3&&Math.random()<.38){s.stay=Math.min(12,s.stay+1);}if(s.drunk<3&&Math.random()<.09)s.drunk++;show(s.g,'お客様の反応',reply,s.mood<13?'CHANGE':s.chance?'★ CHANCE TIME':'REACTION',[['接客を続ける ▶',talk]],'機嫌 '+Math.round(s.mood)+' ｜ 会話の勢い '+('●'.repeat(Math.min(5,s.momentum))||'—')+' ｜ 売上 '+money(amt),s.mood<13?'怒り':delta>=8?'笑顔':'通常');}
function castEvent(){let c=pick(WOMEN.filter(x=>x.id!==s.hero.id));let help=Math.random()<.55;let line=help?'黒服「'+c.name+'、ヘルプに入って！」\n'+c.name+'「今、何のお話をしていたんですか？」':c.name+'「楽しそう！ 少し混ざってもいい？」';show(c,'同僚イベント',line,help?'HELP CALL':'CAST INTERRUPT',[['話題を説明して一緒に接客',()=>castAct(12,'「二人で話せて楽しいね」',0)],['ヘルプに任せて体力を回復',()=>castAct(2,'「落ち着いた時間だったよ」',10)],['お客様の希望を確認する',()=>castAct(9,'「気遣いがいいね」',2)],['二人で客を取り合う',()=>castAct(-19,'「喧嘩するなら帰るよ」',0)]],'同僚：'+c.name+' ｜ '+c.role);}
function castAct(delta,reply,recover){s.energy=Math.min(100,s.energy+recover);s.mood=Math.max(0,Math.min(100,s.mood+delta));show(s.g,'同僚イベントの結果',reply,'CAST RESULT',[['接客を続ける ▶',talk]],'機嫌 '+Math.round(s.mood)+' ｜ 体力 '+s.energy);}
function leave(text){show(s.g,'退席',text+'\nこの席の売上 '+money(s.table),'TABLE RESULT',[['次のお客様へ ▶',()=>{s.seat++;newCustomer()}]],'今夜は残り '+(2-s.seat)+'組');}
$('showcatalog').onclick=()=>{let el=$('catalog');el.classList.toggle('on');if(el.innerHTML)return;for(const [title,people] of [['男性客20人',MEN],['女性キャスト20人',WOMEN]]){let h=document.createElement('h3');h.textContent=title;el.append(h);let grid=document.createElement('div');grid.className='catalog-grid';for(const p of people){let tile=document.createElement('div');tile.className='tile';let img=document.createElement('img');img.src=PHOTOS[p.id];let name=document.createElement('span');name.textContent=p.name;tile.append(img,name);grid.append(tile)}el.append(grid)}};
$('reset').onclick=()=>{if(confirm('最初からやり直しますか？'))start()};start();
</script></body></html>
